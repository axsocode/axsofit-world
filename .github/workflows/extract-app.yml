name: Extract AXSOFIT WORLD app
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract application from uploaded ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          import shutil
          
          archive = Path("AXSOFIT_WORLD_Academia_Progresiva.zip")
          if not archive.exists():
              raise SystemExit("No se encontró el ZIP en la raíz del repositorio.")
          
          with zipfile.ZipFile(archive) as z:
              names = [n for n in z.namelist() if not n.endswith("/")]
              package_entries = [n for n in names if n.endswith("/package.json") or n == "package.json"]
              if len(package_entries) != 1:
                  raise SystemExit(f"Se esperaba un package.json dentro del ZIP; encontrados: {package_entries}")
              root = package_entries[0].rsplit("/", 1)[0] if "/" in package_entries[0] else ""
              selected_dirs = ("src", "public")
              selected_files = ("package.json", "index.html", "vite.config.ts", "tsconfig.json", ".env.example")
              extracted = []
              for name in names:
                  rel = name[len(root)+1:] if root and name.startswith(root + "/") else (name if not root else None)
                  if rel is None or not rel:
                      continue
                  top = rel.split("/", 1)[0]
                  if top in selected_dirs or rel in selected_files or rel == "README.md":
                      target = Path(rel)
                      if target.is_absolute() or ".." in target.parts:
                          raise SystemExit(f"Ruta insegura en ZIP: {name}")
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(name) as src, open(target, "wb") as dst:
                          shutil.copyfileobj(src, dst)
                      extracted.append(rel)
          
          required = ["src/App.tsx", "public/models/axsofit-humanoid-rig.glb", "package.json"]
          missing = [p for p in required if not Path(p).exists()]
          if missing:
              raise SystemExit(f"Faltan archivos esenciales tras extracción: {missing}")
          
          if Path("README.md").exists():
              shutil.copyfile("README.md", "APP_README.md")
          print("Archivos extraídos:", *sorted(extracted), sep="\n- ")
          PY

      - name: Commit extracted application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public package.json index.html vite.config.ts tsconfig.json .env.example APP_README.md
          git diff --cached --quiet || git commit -m "Extract AXSOFIT WORLD app from source archive"
          git push
